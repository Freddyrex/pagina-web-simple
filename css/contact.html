    <div class="page-hero">
        <h1>Contacto</h1>
        <p>Completa el formulario para ponerte en contacto</p>
    </div>

    <main>
        <section>
            <h2><font color="#1F4E79">Formulario de contacto</font></h2>
            <form action="#" method="post">
                <p>
                    <label for="name">Nombre:</label><br>
                    <input type="text" id="name" name="name" required>
                </p>
                <p>
                    <label for="email">Correo electrónico:</label><br>
                    <input type="email" id="email" name="email" required>
                </p>
                <p>
                    <label for="birthdate">Fecha de nacimiento:</label><br>
                    <input type="date" id="birthdate" name="birthdate">
                </p>
                <p>
                    <label for="program">Carrera:</label><br>
                    <select id="program" name="program">
                        <option value="sistemas">Ciencias de la computacion</option>
                        <option value="industrial">Matematicas</option>
                        <option value="civil">ciencia de datos</option>
                        <option value="administracion">Fisica</option>
                    </select>
                </p>
                <p>
                    <label for="semester">Semestre:</label><br>
                    <input type="number" id="semester" name="semester" min="1" max="12">
                </p>
                <p>
                    <label for="reason">Motivo de contacto:</label><br>
                    <input type="text" id="reason" name="reason">
                </p>
                <p>
                    <label for="message">Mensaje:</label><br>
                    <textarea id="message" name="message" rows="5" cols="30"></textarea>
                </p>
                <p>
                    <input type="checkbox" id="accept" name="accept">
                    <label for="accept">Acepto los términos y condiciones</label>
                </p>
                <p>
                    <button type="submit">Enviar</button>
                </p>
            </form>
        </section>
    </main>
